<!DOCTYPE html>
<html lang="id">
<head>

  <!-- Design tokens -->
  <link rel="stylesheet" href="src/tokens.css?v=7" />
  <link rel="stylesheet" href="src/warm.css?v=5" />

    #root { min-height: 100vh; }
    .samase-mono { font-family: 'JetBrains Mono', monospace; }
    .samase-display { font-family: 'Exo 2', 'Inter Tight', sans-serif; }
    .samase-serif-italic { font-family: 'Exo 2', 'Inter Tight', sans-serif; font-style: italic; font-weight: 800; }

    /* Smoother font weights for umbrella */

    h1, h2, h3, h4 { font-family: 'Exo 2', 'Inter Tight', sans-serif; font-weight: 800; letter-spacing: -0.025em; }

    /* No scrollbar styling on desktop */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #0A0706; }
    ::-webkit-scrollbar-thumb { background: #2A1F17; border-radius: 4px; }

  <div id="root"></div>

  <!-- Stores -->

    root.render(<UmbrellaApp />);
