  <style>/* SAMASE Design Tokens — base layer */

:root {
  /* Type */
  --font-display: 'Fraunces', ui-serif, Georgia, serif;
  --font-body: 'Inter Tight', ui-sans-serif, system-ui, -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;

  /* Spacing scale */
  --s-1: 4px;
  --s-2: 8px;
  --s-3: 12px;
  --s-4: 16px;
  --s-5: 24px;
  --s-6: 32px;
  --s-7: 48px;
  --s-8: 64px;
  --s-9: 96px;
  --s-10: 128px;

  /* Radius */
  --r-sm: 4px;
  --r-md: 8px;
  --r-lg: 16px;
  --r-xl: 24px;

  /* Default (warm) — overridden by skin */
  --bg: #FAF7F1;
  --bg-elev: #F3EEE4;
  --bg-card: #FFFFFF;
  --ink: #1C1A17;
  --ink-soft: #433E36;
  --ink-mute: #776F63;
  --line: #E3DCCB;
  --line-soft: #EDE7D9;
  --accent: #6B5842;
  --accent-soft: #A68D6F;
  --gold: #B89467;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font-body);
  color: var(--ink);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-size: 16px;
  line-height: 1.55;
  letter-spacing: -0.005em;
}

.samase-mono {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-weight: 500;
}

.samase-display {
  font-family: var(--font-display);
  font-weight: 350;
  letter-spacing: -0.02em;
  line-height: 1.05;
}

.samase-serif-italic {
  font-family: var(--font-display);
  font-style: italic;
  font-weight: 350;
}

/* Shared primitive classes */
.samase-container {
  max-width: 1240px;
  margin: 0 auto;
  padding: 0 32px;
}

@media (max-width: 720px) {
  .samase-container { padding: 0 20px; }
}

.hairline { height: 1px; background: var(--line); width: 100%; }
.hairline-soft { height: 1px; background: var(--line-soft); width: 100%; }

button { font-family: inherit; cursor: pointer; }
a { color: inherit; text-decoration: none; }

/* Scroll anchor offset */
[id^="section-"] { scroll-margin-top: 40px; }

/* Selection */
::selection { background: var(--ink); color: var(--bg); }

/* Reveal on scroll */
.reveal {
  opacity: 0;
  transform: translateY(14px);
  transition: opacity 900ms cubic-bezier(.2,.6,.2,1), transform 900ms cubic-bezier(.2,.6,.2,1);
}
.reveal.in {
  opacity: 1;
  transform: translateY(0);
}

  <script type="text/babel">// SAMASE — brand mark
// Default monogram/wordmark SVGs are inlined below for offline use.
// To swap: paste the official SVG source into brand/monogram.svg /
// brand/wordmark.svg and set window.SAMASE_LOGO = { monogram: 'brand/...' },
// or upload via Admin Panel → Brand tab (uses a Blob URL from localStorage).

// Default inline SVGs (baked in so standalone export works offline)
const DEFAULT_MONOGRAM_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 140" aria-label="SAMASE">
  <g fill="currentColor">
    <path d="M 20 14 L 116 14 L 124 20 L 120 46 L 20 46 A 16 16 0 0 1 4 30 A 16 16 0 0 1 20 14 Z"/>

    <path d="M 220 14 L 124 14 L 116 20 L 120 46 L 220 46 A 16 16 0 0 0 236 30 A 16 16 0 0 0 220 14 Z"/>
    <path d="M 200 58 L 120 58 L 120 82 L 200 82 A 12 12 0 0 0 212 70 A 12 12 0 0 0 200 58 Z"/>
    <path d="M 220 94 L 124 94 L 116 100 L 120 126 L 200 126 A 20 20 0 0 0 236 114 A 16 16 0 0 0 236 110 L 236 106 A 16 16 0 0 0 220 94 Z"/>
    <path d="M 112 14 L 128 14 L 124 20 L 116 20 Z"/>
  </g>
</svg>`;

const DEFAULT_WORDMARK_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" aria-label="SAMASE SPORTS CLUB">
  <text x="160" y="72" text-anchor="middle" font-family="'Inter Tight', system-ui, sans-serif" font-weight="900" font-size="72" letter-spacing="2" fill="currentColor">SAMASE</text>
  <text x="160" y="128" text-anchor="middle" font-family="'Inter Tight', system-ui, sans-serif" font-weight="800" font-size="40" letter-spacing="4" fill="currentColor">SPORTS CLUB</text>
</svg>`;

// External file paths (used only if window.SAMASE_LOGO override)
const DEFAULT_MONOGRAM_URL = 'brand/monogram.svg';
const DEFAULT_WORDMARK_URL = 'brand/wordmark.svg';

function getLogoPaths() {
  const override = (typeof window !== 'undefined' && window.SAMASE_LOGO) || {};
  return {
    monogram: override.monogram || DEFAULT_MONOGRAM_URL,
    wordmark: override.wordmark || DEFAULT_WORDMARK_URL,
  };
}

// Tick state to re-render when window.SAMASE_LOGO updates (via admin upload)
function useLogoPaths() {
  const [tick, setTick] = React.useState(0);
  React.useEffect(() => {
    const handler = () => setTick(t => t + 1);
    window.addEventListener('samase:logo-update', handler);
    window.addEventListener('storage', handler);
    return () => {
      window.removeEventListener('samase:logo-update', handler);
      window.removeEventListener('storage', handler);
    };
  }, []);
  return getLogoPaths();
}

function SamaseMark({ size = 22, subtitle = null, variant = 'lockup', color }) {
  const paths = useLogoPaths();
  const hasOverride = !!(typeof window !== 'undefined' && window.SAMASE_LOGO);

  const monogram = hasOverride && window.SAMASE_LOGO.monogram
    ? <InlineSvg
        src={window.SAMASE_LOGO.monogram}
        height={size * 1.5}
        color={color}
        aspectRatio={240 / 140}
      />
    : <InlineSvgFromText
        svgText={DEFAULT_MONOGRAM_SVG}
        height={size * 1.5}
        color={color}
      />;

  const wordmark = hasOverride && window.SAMASE_LOGO.wordmark
    ? <InlineSvg
        src={window.SAMASE_LOGO.wordmark}
        height={size * 0.82}
        color={color}
        aspectRatio={320 / 160}
      />
    : <InlineSvgFromText
        svgText={DEFAULT_WORDMARK_SVG}
        height={size * 0.82}
        color={color}
        widthScale={2}
      />;

  if (variant === 'monogram') return monogram;
  if (variant === 'wordmark') return wordmark;

  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
      {monogram}
      <div style={{ display: 'flex', flexDirection: 'column', lineHeight: 1 }}>
        {wordmark}
        {subtitle && (
          <span
            className="samase-mono"
            style={{
              fontSize: 9,
              color: color || 'var(--ink-mute)',
              opacity: 0.75,
              marginTop: 5,
              letterSpacing: '0.18em',
            }}
          >
            {subtitle}
          </span>
        )}
      </div>
    </div>
  );

/**
 * InlineSvgFromText — renders inline SVG from a string constant.
 * Used for the default baked-in logos so the page works offline.
 */
function InlineSvgFromText({ svgText, height, color, widthScale = 1 }) {
  // Read viewBox to preserve aspect
  const vbMatch = svgText.match(/viewBox="([^"]+)"/);
  const vb = vbMatch ? vbMatch[1].split(/\s+/).map(Number) : [0, 0, 1, 1];
  const ratio = (vb[2] / vb[3]) * widthScale;
  const width = height * ratio;
  return (
    <span
      style={{
        display: 'inline-flex',
        height,
        color: color || 'currentColor',
        alignItems: 'center',
      }}
      dangerouslySetInnerHTML={{
        __html: sizeSvg(svgText, width, height),
      }}
    />
  );
}

/**
 * InlineSvg — fetches an SVG file and inlines it so `currentColor`
 * and CSS variables work. Falls back to <img> on error.
 * Cached globally to avoid refetching.
 */
const _svgCache = {};
const _svgListeners = {};

function InlineSvg({ src, height, color, aspectRatio = 1 }) {
  const [svgText, setSvgText] = React.useState(_svgCache[src] || null);

  React.useEffect(() => {
    if (_svgCache[src]) {
      setSvgText(_svgCache[src]);
      return;
    }
    if (_svgListeners[src]) {
      _svgListeners[src].push(setSvgText);
      return;
    }
    _svgListeners[src] = [setSvgText];

    fetch(src)
      .then(r => r.ok ? r.text() : null)
      .then(txt => {
        if (txt) {
          // Strip XML declaration and any HTML comments, keep <svg>...</svg> only
          const m = txt.match(/<svg[\s\S]*<\/svg>/i);
          const cleaned = m ? m[0] : txt;
          _svgCache[src] = cleaned;
          (_svgListeners[src] || []).forEach(fn => fn(cleaned));
        } else {
          _svgCache[src] = '__error__';
          (_svgListeners[src] || []).forEach(fn => fn('__error__'));
        }
        delete _svgListeners[src];
      })
      .catch(() => {
        _svgCache[src] = '__error__';
        (_svgListeners[src] || []).forEach(fn => fn('__error__'));
        delete _svgListeners[src];
      });
  }, [src]);

  const width = height * aspectRatio;

  if (!svgText) {
    // Loading — reserve space
    return (
      <span style={{
        display: 'inline-block',
        width: width,
        height: height,
      }} />
    );
  }

  if (svgText === '__error__') {
    // Fallback to <img> in case file exists but fetch failed due to CORS
    return (
      <img
        src={src}
        alt="SAMASE"
        style={{ height, width: 'auto', display: 'block', color }}
      />
    );
  }

  // Inject the SVG as HTML. The SVG should use fill="currentColor".
  // Wrap in a span with the target color so `currentColor` resolves correctly.
  return (
    <span
      style={{
        display: 'inline-flex',
        height: height,
        color: color || 'currentColor',
        alignItems: 'center',
      }}
      dangerouslySetInnerHTML={{
        __html: sizeSvg(svgText, width, height),
      }}
    />
  );
}

// Ensure the inlined SVG has explicit width/height attributes so it scales predictably.
function sizeSvg(svgText, width, height) {
  return svgText.replace(
    /<svg\b([^>]*)>/i,
    (match, attrs) => {
      // Strip existing width/height
      let cleaned = attrs.replace(/\swidth="[^"]*"/gi, '').replace(/\sheight="[^"]*"/gi, '');
      return `<svg${cleaned} width="${width}" height="${height}" style="display:block">`;
    }
  );
}

// ============ Backward-compat inline fallbacks ============
// Kept available for places that explicitly use the React components.
function SamaseMonogram({ size = 36, fill = 'currentColor' }) {
  return (
    <InlineSvg
      src={getLogoPaths().monogram}
      height={size}
      color={fill}
      aspectRatio={240 / 140}
    />
  );
}

function SamaseWordmark({ height = 16, color = 'currentColor' }) {
  return (
    <InlineSvg
      src={getLogoPaths().wordmark}
      height={height * 2}
      color={color}
      aspectRatio={320 / 160}
    />
  );
}

function Reveal({ children, delay = 0 }) {
  const ref = React.useRef(null);
  const [vis, setVis] = React.useState(false);
  React.useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const io = new IntersectionObserver(
      entries => {
        entries.forEach(e => {
          if (e.isIntersecting) {
            setTimeout(() => setVis(true), delay);
            io.disconnect();
          }
        });
      },
      { threshold: 0.12 }
    );
    io.observe(el);
    return () => io.disconnect();
  }, [delay]);
  return (
    <div ref={ref} className={'reveal' + (vis ? ' in' : '')}>

    </div>
  );
}

function FacilitySlider({ photos, paused, title }) {
  const slides = photos && photos.length > 0 ? photos : [

  ];
  const [idx, setIdx] = React.useState(0);

  // Auto-slide every 4s, pause on hover
  React.useEffect(() => {
    if (paused) return;
    const t = setInterval(() => {
      setIdx(i => (i + 1) % slides.length);
    }, 4000);
    return () => clearInterval(t);
  }, [paused, slides.length]);

  const go = (delta) => setIdx(i => (i + delta + slides.length) % slides.length);
  const jump = (i) => setIdx(i);

  const cur = slides[idx];

// ============ Countdown hook ============
function useCountdown(targetIso) {
  const [now, setNow] = React.useState(Date.now());
  React.useEffect(() => {
    const t = setInterval(() => setNow(Date.now()), 1000);
    return () => clearInterval(t);
  }, []);
  const diff = Math.max(0, new Date(targetIso).getTime() - now);
  const d = Math.floor(diff / 86400000);
  const h = Math.floor((diff % 86400000) / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  const s = Math.floor((diff % 60000) / 1000);
  return { d, h, m, s, done: diff === 0 };
}

// ---------- Scarcity signal (top-right of founding header) ----------
function ScarcitySignal({ mode, batches, totalApplicants }) {

  const copy = S.scarcityCopy[mode] || S.scarcityCopy.hard;
  const closing = S.brand.closingDate;
  const cd = useCountdown(closing);
  const active = batches.find(b => b.status === 'active') || batches[0];

  return (
    <div style={{
      background: 'rgba(255,255,255,0.04)',
      border: '1px solid rgba(255,255,255,0.14)',

        fontSize: 22,

        margin: '0 0 22px 0',
        fontSize: 15,
        color: 'var(--founding-ink)',

        <div style={{ display: 'grid', gap: 12 }}>

              Gelombang aktif · {active.label}
            </span>
            <span className="samase-display" style={{ fontSize: 22, color: 'var(--founding-ink)' }}>
              {active.slotsTaken}<span style={{ opacity: 0.45 }}>/{active.slotsTotal}</span>
            </span>
          </div>
          <div style={{ height: 2, background: 'rgba(255,255,255,0.14)', overflow: 'hidden' }}>
            <div style={{
              height: '100%',
              width: `${Math.round((active.slotsTaken / active.slotsTotal) * 100)}%`,
              background: 'var(--founding-accent)',
              transition: 'width 1s cubic-bezier(.2,.6,.2,1)',
            }} />
          </div>
        </div>

function CountdownBlock({ cd, small }) {

function Field({ label, value, onChange, type = 'text', placeholder, textarea, required }) {
  const [focus, setFocus] = React.useState(false);

    width: '100%',

    background: 'transparent',
    border: 'none',
    borderBottom: `1px solid ${focus ? 'var(--ink)' : 'var(--line)'}`,

  return (
    <div>

        display: 'block',
        color: focus ? 'var(--ink)' : 'var(--ink-mute)',
        marginBottom: 4,
        transition: 'color 180ms',
      }}>
        {label}{required && <span style={{color: 'var(--gold)', marginLeft: 4}}>*</span>}
      </label>
      {textarea ? (
        <textarea
          value={value}
          onChange={onChange}
          placeholder={placeholder}
          rows={3}
          onFocus={() => setFocus(true)}
          onBlur={() => setFocus(false)}
          style={base}
        />
      ) : (
        <input
          type={type}
          value={value}
          onChange={onChange}
          placeholder={placeholder}
          required={required}
          onFocus={() => setFocus(true)}
          onBlur={() => setFocus(false)}
          style={base}
        />
      )}

  );
}

  <script type="text/babel">// SAMASE — Admin / CMS Panel ("Kelola Landing Page")
// Always available in production via a small floating pill in the bottom-right.
// Click the pill → prompts for admin passcode → opens full CMS panel.
// Also responds to the design-tool Tweaks toggle protocol for in-editor use.

const ADMIN_PASSCODE = /*EDITMODE-PASSCODE*/ 'samase2026' /*EDITMODE-PASSCODE-END*/;
// ^ adjustable via CMS later; change this string to lock the panel.

function TweaksPanel({ state, update }) {
  // Two ways to activate:
  //  1. The design tool's "Tweaks" toggle (dispatches custom events)
  //  2. Clicking the floating "Kelola" pill + entering passcode
  const [tweaksActive, setTweaksActive] = React.useState(false);
  const [adminUnlocked, setAdminUnlocked] = React.useState(() => {
    try { return sessionStorage.getItem('samase_admin') === 'ok'; } catch(_) { return false; }
  });
  const [panelOpen, setPanelOpen] = React.useState(true);
  const [showLogin, setShowLogin] = React.useState(false);
  const [tab, setTab] = React.useState('visual');

  // Design-tool Tweaks protocol
  React.useEffect(() => {
    const onActivate = () => setTweaksActive(true);
    const onDeactivate = () => setTweaksActive(false);
    window.addEventListener('designer2:tweaks-activate', onActivate);
    window.addEventListener('designer2:tweaks-deactivate', onDeactivate);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => {
      window.removeEventListener('designer2:tweaks-activate', onActivate);
      window.removeEventListener('designer2:tweaks-deactivate', onDeactivate);
    };
  }, []);

  // Keyboard shortcut: Cmd/Ctrl+Shift+K toggles the pill directly
  React.useEffect(() => {
    const onKey = (e) => {
      if ((e.metaKey || e.ctrlKey) && e.shiftKey && (e.key === 'K' || e.key === 'k')) {
        e.preventDefault();
        if (adminUnlocked) {
          setPanelOpen(o => !o);
        } else {
          setShowLogin(true);
        }
      }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [adminUnlocked]);

  const active = tweaksActive || adminUnlocked;

  // Layouts, palettes, scarcity options
  const layouts = [
    { id: 'editorial',     label: 'Editorial',     desc: 'Magazine, serif-forward' },
    { id: 'zen',           label: 'Zen Minimal',   desc: 'Centered, ultra calm' },
    { id: 'architectural', label: 'Architectural', desc: 'Heavy grid, sans-serif' },
    { id: 'hero',          label: 'Hero-Focus',    desc: 'Cinematic, progress in hero' },

  ];
  const scarcities = [
    { id: 'hard',   label: 'Hard Quota',    desc: 'Tampilkan angka: "X/Y Visionary terisi"' },
    { id: 'soft',   label: 'Soft Scarcity', desc: 'Tanpa angka, hanya countdown' },
    { id: 'hybrid', label: 'Hybrid',        desc: '"X+ applicants" + deadline' },
  ];
  const tabs = [
    { id: 'visual',    label: 'Visual' },
    { id: 'batches',   label: 'Batches' },
    { id: 'copy',      label: 'Copy' },
    { id: 'facilities', label: 'Fasilitas' },
    { id: 'coaches',   label: 'Coach' },
    { id: 'brand',     label: 'Brand' },
  ];

  // ============ Render ============

  // Login modal
  if (showLogin && !adminUnlocked) {
    return (
      <LoginModal
        onCancel={() => setShowLogin(false)}
        onSuccess={() => {
          try { sessionStorage.setItem('samase_admin', 'ok'); } catch(_) {}
          setAdminUnlocked(true);
          setShowLogin(false);
          setPanelOpen(true);
        }}
      />
    );
  }

  // Not active = show compact pill (for site owner)
  if (!active) {
    return (
      <AdminPill onClick={() => setShowLogin(true)} />
    );
  }

  // Active = show full panel
  return (
    <>
      {adminUnlocked && !panelOpen && (
        <AdminPill open onClick={() => setPanelOpen(true)} />
      )}
      {panelOpen && (
        <AdminPanel
          state={state}
          update={update}
          tab={tab}
          setTab={setTab}
          tabs={tabs}
          layouts={layouts}

          onClose={() => {
            if (adminUnlocked) setPanelOpen(false);
            else setTweaksActive(false);
          }}
          onLogout={adminUnlocked ? () => {
            try { sessionStorage.removeItem('samase_admin'); } catch(_) {}
            setAdminUnlocked(false);
            setPanelOpen(false);
          } : null}
        />
      )}
    </>
  );
}

// ============ Brand Admin tab — upload monogram/wordmark SVG ============
function BrandAdminTab() {
  const [monoSvg, setMonoSvg] = React.useState(() => {
    try { return localStorage.getItem('samase_brand_monogram') || ''; } catch(_) { return ''; }
  });
  const [wordSvg, setWordSvg] = React.useState(() => {
    try { return localStorage.getItem('samase_brand_wordmark') || ''; } catch(_) { return ''; }
  });
  const [msg, setMsg] = React.useState(null);

  const handleFile = (kind) => (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    if (!/svg/i.test(file.type) && !/\.svg$/i.test(file.name)) {
      setMsg({ kind: 'err', text: 'File harus format SVG.' });
      return;
    }
    const reader = new FileReader();
    reader.onload = (ev) => {
      const svgText = ev.target.result;
      try {
        if (kind === 'monogram') {
          localStorage.setItem('samase_brand_monogram', svgText);
          setMonoSvg(svgText);
        } else {
          localStorage.setItem('samase_brand_wordmark', svgText);
          setWordSvg(svgText);
        }
        // Trigger reload so the new logo takes effect everywhere
        applyBrandOverrides();
        setMsg({ kind: 'ok', text: `Logo ${kind} berhasil diupload. Refresh halaman untuk update semua lokasi.` });
        setTimeout(() => setMsg(null), 4000);
      } catch(err) {
        setMsg({ kind: 'err', text: 'Gagal simpan: ' + err.message });
      }
    };
    reader.readAsText(file);
  };

  const clearLogo = (kind) => () => {
    try {
      localStorage.removeItem(kind === 'monogram' ? 'samase_brand_monogram' : 'samase_brand_wordmark');
      if (kind === 'monogram') setMonoSvg(''); else setWordSvg('');
      applyBrandOverrides();
      setMsg({ kind: 'ok', text: 'Logo dikembalikan ke default. Refresh halaman.' });
      setTimeout(() => setMsg(null), 3000);
    } catch(_) {}
  };

  return (
    <>
      <SectionTitle>Upload Logo Resmi</SectionTitle>
      <div style={{ fontSize: 11, color: '#7A6A5A', lineHeight: 1.55, marginBottom: 14 }}>
        Upload file SVG dari logopack. Logo akan otomatis tersimpan di browser Anda dan tampil di seluruh landing page (navbar, footer, dll).
      </div>

      {/* Monogram uploader */}

}

// Apply brand overrides from localStorage into window.SAMASE_LOGO
// so SamaseMark components pick them up. Called on mount and on upload.
function applyBrandOverrides() {
  try {
    const mono = localStorage.getItem('samase_brand_monogram');
    const word = localStorage.getItem('samase_brand_wordmark');
    const paths = {};
    if (mono) {
      // Turn the SVG text into a data URL so InlineSvg can fetch it
      const blob = new Blob([mono], { type: 'image/svg+xml' });
      paths.monogram = URL.createObjectURL(blob);
    }
    if (word) {
      const blob = new Blob([word], { type: 'image/svg+xml' });
      paths.wordmark = URL.createObjectURL(blob);
    }
    if (Object.keys(paths).length) {
      window.SAMASE_LOGO = paths;
    } else {
      delete window.SAMASE_LOGO;
    }
    try { window.dispatchEvent(new Event('samase:logo-update')); } catch(_) {}
  } catch(_) {}
}

// Apply on first load
if (typeof window !== 'undefined') {
  applyBrandOverrides();
}

Object.assign(window, { TweaksPanel });

  <script type="text/babel">// SAMASE — App root (expanded with CMS state)

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "variant": "warm",
  "layout": "editorial",
  "scarcityMode": "hard",
  "heroTitleTop": "Ruang tenang",
  "heroTitleMid": "untuk tubuh yang",
  "heroTitleBot": "dijaga dengan niat.",
  "heroLede": "SAMASE Sports Club — Exclusive Active Lifestyle Club. Modern, sophisticated, privacy-first. Klub gaya hidup aktif untuk mereka yang memilih bergerak tanpa tuntutan tampil.",
  "opening": "Juli 2026",
  "city": "Jakarta — Bintaro",
  "closingDate": "2026-06-15T23:59:00+07:00",
  "batches": [
    { "id": "visionary", "slotsTaken": 58, "slotsTotal": 80, "status": "active" },
    { "id": "pioneer",   "slotsTaken": 0,  "slotsTotal": 120, "status": "upcoming" },
    { "id": "founder",   "slotsTaken": 0,  "slotsTotal": 150, "status": "upcoming" }
  ]
}/*EDITMODE-END*/;

function App() {
  // Load persisted state — merge with defaults
  const [state, setState] = React.useState(() => {
    try {
      const raw = localStorage.getItem('samase_tweaks_v2');
      if (raw) return { ...TWEAK_DEFAULTS, ...JSON.parse(raw) };
    } catch(_) {}
    return TWEAK_DEFAULTS;
  });

  // Apply variant class + layout class to body
  React.useEffect(() => {
    document.body.classList.remove('variant-warm', 'variant-deep', 'variant-stone');
    document.body.classList.add('variant-' + state.variant);
    document.body.classList.toggle('body-dark', state.variant === 'deep');

    document.body.classList.remove('layout-editorial', 'layout-zen', 'layout-arch', 'layout-hero');
    document.body.classList.add('layout-' + (state.layout === 'architectural' ? 'arch' : state.layout));

    try {
      localStorage.setItem('samase_tweaks_v2', JSON.stringify(state));
    } catch(_) {}
  }, [state]);

  // Sync CMS state into window.SAMASE (so components re-read from global)
  React.useEffect(() => {
    const S = window.SAMASE;
    S.hero.titleTop = state.heroTitleTop;
    S.hero.titleMid = state.heroTitleMid;
    S.hero.titleBot = state.heroTitleBot;
    S.hero.lede = state.heroLede;
    S.brand.opening = state.opening;
    S.brand.city = state.city;
    S.brand.closingDate = state.closingDate;
    S.founding.scarcityMode = state.scarcityMode;
    // Merge batch CMS fields into batch definitions (keep static perks/tagline)
    state.batches.forEach((b, i) => {
      if (S.founding.batches[i]) {
        S.founding.batches[i].slotsTaken = b.slotsTaken;
        S.founding.batches[i].slotsTotal = b.slotsTotal;
        S.founding.batches[i].status = b.status;
        // keep badge in sync with status
        S.founding.batches[i].badge =
          b.status === 'active' ? 'Sedang Dibuka' :
          b.status === 'upcoming' ? 'Segera Dibuka' : 'Telah Ditutup';
      }
    });
  }, [state]);

  // Update helper
  const update = React.useCallback((patch) => {
    setState(prev => {
      const next = { ...prev, ...patch };
      // Persist via host postMessage (edits file)
      try {
        window.parent.postMessage({
          type: '__edit_mode_set_keys',
          edits: patch,
        }, '*');
      } catch(_) {}
      return next;
    });
  }, []);

  return (
    <div key={state.layout + '-' + state.scarcityMode}>
      <Navbar />
      <main>
        <LayoutRenderer layout={state.layout} />
      </main>
      <Footer />
      <TweaksPanel state={state} update={update} />
    </div>
  );
}

window.App = App;
</script>

  <script type="text/babel">
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
