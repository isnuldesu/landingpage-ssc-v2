<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SAMASE Private Padel · Menyusul</title>
  <meta name="description" content="SAMASE Private Padel — lapangan padel privat dengan fasilitas premium. Dibuka setelah Fitspace dan Physio. Info lebih lanjut menyusul." />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,200..900;1,200..900&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="src/tokens.css?v=7" />
  <link rel="stylesheet" href="src/warm.css?v=5" />

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <style>
    html, body {
      margin: 0; padding: 0;
      font-family: 'Inter Tight', system-ui, sans-serif;
      background: #0A0706; color: #F2EEE5;
    }
    #root { min-height: 100vh; display: flex; flex-direction: column; }
    .samase-mono { font-family: 'JetBrains Mono', monospace; }
    .samase-display { font-family: 'Exo 2', 'Inter Tight', sans-serif; }
    body { font-weight: 400; }
    h1, h2, h3 { font-family: 'Exo 2', 'Inter Tight', sans-serif; font-weight: 800; letter-spacing: -0.025em; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="src/cms-store.js?v=4"></script>
  <script src="src/media-store.js?v=2"></script>
  <script type="text/babel" src="src/content.js?v=15"></script>
  <script type="text/babel" src="src/layout-photo.jsx?v=4"></script>
  <script type="text/babel" src="src/umbrella-app.jsx?v=3"></script>
  <script type="text/babel" src="src/admin-floating-link.jsx?v=1"></script>

  <script type="text/babel">
    function PadelPage() {
      const S = window.SAMASE || window.SAMASE_DEFAULTS;
      return (
        <div>
          <UmbrellaNav />
          <section style={{
            flex: 1,
            minHeight: '100vh',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            padding: '160px 40px 80px',
            position: 'relative',
            background: '#0A0706',
            overflow: 'hidden',
          }}>
            <div style={{ position: 'absolute', inset: 0, opacity: 0.4 }}>
              <window.PhotoSlot
                slotKey="padel.hero"
                label="PADEL · TEASER"
                subject="padel"
                tone="cinematic"
                aspect="auto"
                style={{ width: '100%', height: '100%', aspectRatio: 'auto' }}
              />
            </div>
            <div aria-hidden style={{
              position: 'absolute', inset: 0,
              background: 'radial-gradient(ellipse at center, rgba(10,7,6,0.5) 0%, rgba(10,7,6,0.95) 80%)',
            }}/>

            <div style={{ position: 'relative', zIndex: 2, maxWidth: 720, textAlign: 'center' }}>
              <div className="samase-mono" style={{
                fontSize: 10, letterSpacing: '0.26em', textTransform: 'uppercase',
                color: '#E8B88A', marginBottom: 32,
              }}>
                SAMASE Private Padel · Menyusul
              </div>
              <h1 style={{
                margin: 0,
                fontFamily: 'var(--font-display)',
                fontSize: 'clamp(40px, 6.5vw, 88px)',
                fontWeight: 300,
                lineHeight: 1.05,
                letterSpacing: '-0.025em',
              }}>
                Lapangan <span style={{ fontStyle: 'italic' }}>privat,</span><br/>
                dibuka setelah fondasinya jadi.
              </h1>
              <p style={{
                margin: '32px auto 0', maxWidth: 560,
                fontSize: 16, lineHeight: 1.75,
                color: 'rgba(242,238,229,0.75)',
              }}>
                SAMASE Private Padel akan menyusul setelah Fitspace dan Physio berjalan. Kami ingin memastikan setiap layanan punya ruang, tim, dan ritme yang layak — sebelum menambah yang berikutnya.
              </p>
              <p style={{
                margin: '24px auto 0', maxWidth: 520,
                fontSize: 15, lineHeight: 1.7,
                color: 'rgba(242,238,229,0.65)',
                fontStyle: 'italic',
              }}>
                Sementara ini, Postural Assessment bisa menjadi titik awal keanggotaan SAMASE Sports Club — termasuk akses prioritas saat Padel dibuka.
              </p>
              <div style={{ marginTop: 48, display: 'flex', gap: 20, justifyContent: 'center', flexWrap: 'wrap' }}>
                <a href="campaign.html?src=padel" style={{
                  display: 'inline-block',
                  padding: '18px 30px',
                  background: '#F2EEE5', color: '#0A0706',
                  fontFamily: 'JetBrains Mono, monospace',
                  fontSize: 12, letterSpacing: '0.14em', textTransform: 'uppercase',
                  textDecoration: 'none',
                }}>
                  Jadwalkan Assessment →
                </a>
                <a href="index.html" style={{
                  fontFamily: 'JetBrains Mono, monospace',
                  fontSize: 11, letterSpacing: '0.16em', textTransform: 'uppercase',
                  color: 'rgba(242,238,229,0.7)', textDecoration: 'none',
                  padding: '18px 8px',
                }}>
                  ← Kembali
                </a>
              </div>
            </div>
          </section>
          <UmbrellaFooter S={S} />
          {window.AdminFloatingLink && <window.AdminFloatingLink />}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<PadelPage />);
  </script>
</body>
</html>
