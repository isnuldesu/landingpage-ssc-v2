<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SAMASE — Admin Panel · Kelola Landing Page</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,200..900;1,200..900&family=Inter+Tight:wght@400;500;600;800;900&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <style>
    :root {
      --ink: #1C1A17;
      --ink-soft: #4A3A2C;
      --ink-mute: #7A6A5A;
      --bg: #F2EEE5;
      --bg-elev: #EAE3D4;
      --line: #D8CFBE;
      --line-soft: #E4DCCB;
      --accent: #A94E2C;
      --accent-soft: #C56A44;
      --gold: #C68B5E;
      --ok: #4A7754;
      --err: #A94E2C;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      font-family: 'Inter Tight', system-ui, sans-serif;
      color: var(--ink);
      background: var(--bg);
      height: 100%;
    }
    body { overflow: hidden; }
    .samase-mono { font-family: 'JetBrains Mono', monospace; letter-spacing: 0.08em; }
    .samase-display { font-family: 'Exo 2', 'Inter Tight', sans-serif; font-weight: 400; letter-spacing: -0.01em; }
    #root { height: 100%; }
    button { font-family: inherit; }
    input, textarea, select { font-family: inherit; }

    /* Form bits shared */
    .lbl {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-mute);
      margin-bottom: 6px;
      display: block;
    }
    .inp {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid var(--line);
      background: #FFFFFF;
      color: var(--ink);
      font-size: 13px;
      border-radius: 6px;
      outline: none;
      transition: border 150ms, box-shadow 150ms;
    }
    .inp:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(169,78,44,0.12); }
    .btn {
      padding: 10px 18px;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.02em;
      transition: all 160ms;
    }
    .btn-primary { background: var(--ink); color: var(--bg); }
    .btn-primary:hover { background: var(--accent); }
    .btn-ghost { background: transparent; color: var(--ink-soft); border: 1px solid var(--line); }
    .btn-ghost:hover { background: var(--bg-elev); }
    .btn-danger { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
    .btn-danger:hover { background: var(--accent); color: var(--bg); }

    kbd {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      padding: 2px 6px;
      background: var(--bg-elev);
      border: 1px solid var(--line);
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- CMS store (must load first) -->
  <script src="src/cms-store.js?v=4"></script>
  <!-- Media store (base64 uploads) -->
  <script src="src/media-store.js?v=2"></script>
  <!-- Demo photos loader (Unsplash seed for presentation) -->
  <script src="src/demo-photos.js?v=4"></script>
  <!-- i18n helper -->
  <script src="src/i18n.js?v=2"></script>
  <!-- Defaults -->
  <script type="text/babel" src="src/content.js?v=14"></script>

  <!-- Brand mark (exposes default SVG for logo preview in admin) -->
  <script type="text/babel" src="src/SamaseMark.js?v=13"></script>

  <!-- Admin tabs (base: visual, hero, batches, audience, facilities, physio flow, coach, etc.) -->
  <script type="text/babel" src="src/admin-tabs.jsx?v=13"></script>
  <!-- Admin tabs (extended: schedule, blog, events, i18n, advanced) -->
  <script type="text/babel" src="src/admin-tabs-ext.jsx?v=3"></script>
  <!-- Admin tabs (sub-brand: main brand, sub-brands, physio pricing, combo, journey, campaign form) -->
  <script type="text/babel" src="src/admin-tabs-sub.jsx?v=1"></script>
  <!-- Demo photos tab -->
  <script type="text/babel" src="src/admin-tab-demo-photos.jsx?v=3"></script>
  <!-- Photo Manager tab (unified per-page upload) -->
  <script type="text/babel" src="src/admin-tab-photos.jsx?v=2"></script>
  <!-- Admin shell (must be last) -->
  <script type="text/babel" src="src/admin-app.jsx?v=9"></script>

  <script type="text/babel">
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<AdminApp />);
  </script>
</body>
</html>
